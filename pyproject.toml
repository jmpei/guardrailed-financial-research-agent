[project]
name = "guardrailed-financial-research-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "secagent @ git+https://github.com/sunblaze-ucb/progent@5be7b63fa96f70bc19b72fbcee81f1c0bcc1a565",
    "agentdojo @ git+https://github.com/sunblaze-ucb/progent@5be7b63fa96f70bc19b72fbcee81f1c0bcc1a565#subdirectory=agentdojo",
    "langchain==1.4.6",
    "langchain-openai==1.7.2",
    "langgraph==1.2.15",
    "langfuse==5.0.1",
    "fastmcp==4.1.0",
    "gradio==6.30.0",
    "pageindex==0.4.0",
]

[dependency-groups]
dev = [
    "playwright==1.63.0",
    "pytest==9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gfra"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:secagent.role_analyzer",
    "ignore::pandas.errors.Pandas4Warning",
]
