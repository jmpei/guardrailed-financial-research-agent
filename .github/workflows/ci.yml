name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    # Fake models only; includes the email cases against a hostile scripted model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # The demo tests read the index manifest, the FinanceBench questions and one filing; all are gitignored.
      - run: |
          mkdir -p data/index data/financebench/pdfs
          cp tests/fixtures/manifest.json data/index/
          base=https://raw.githubusercontent.com/patronus-ai/financebench/main
          curl -sSfL -o data/financebench/financebench_open_source.jsonl $base/data/financebench_open_source.jsonl
          curl -sSfL -o data/financebench/pdfs/3M_2018_10K.pdf $base/pdfs/3M_2018_10K.pdf
      - run: uv run pytest -q
  eval-gate:
    # Spends OpenAI and PageIndex tokens: manual trigger only.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: cd scripts && uv run python eval_gate.py --check-thresholds
      - uses: actions/cache@v4
        with:
          path: data/index
          key: pageindex-${{ hashFiles('src/gfra/config.py') }}-AMD_2022_10K-AMERICANEXPRESS_2022_10K
      - run: uv run python scripts/download_financebench.py
      - run: uv run python scripts/index_documents.py --docs AMD_2022_10K AMERICANEXPRESS_2022_10K
      - run: cd scripts && uv run python eval_gate.py
