name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    # Fake models only; includes the email cases against a hostile scripted model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: .github/ci-data.sh
      - run: uv run pytest -q
  docker:
    # Builds the image and checks the demo page comes up; the fake key means no model call can succeed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/ci-data.sh
      - run: docker build -t gfra .
      - run: docker run -d --name gfra -p 8080:8080 -e OPENAI_API_KEY=sk-test-no-network gfra
      - run: |
          for i in $(seq 60); do curl -sf -o /dev/null localhost:8080/ && exit 0; sleep 2; done
          docker logs gfra; exit 1
  eval-gate:
    # Spends OpenAI and PageIndex tokens: manual trigger only.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: cd scripts && uv run python eval_gate.py --check-thresholds
      - uses: actions/cache@v4
        with:
          path: data/index
          key: pageindex-${{ hashFiles('src/gfra/config.py') }}-AMD_2022_10K-AMERICANEXPRESS_2022_10K
      - run: uv run python scripts/download_financebench.py
      - run: uv run python scripts/index_documents.py --docs AMD_2022_10K AMERICANEXPRESS_2022_10K
      - run: cd scripts && uv run python eval_gate.py
